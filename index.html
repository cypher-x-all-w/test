<!DOCTYPE html>
<html lang="en">

    <title>Firestore Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{--bg-primary:#0f1117;--bg-secondary:#181a20;--bg-card:#1e2128;--bg-card-hover:#282c36;--bg-input:#14161c;--bg-sidebar:#0b0d12;--text-primary:#e8edf5;--text-secondary:#8b95a9;--text-muted:#5a6478;--border-color:#2a2e3a;--accent:#4f7cff;--accent-hover:#6a8fff;--accent-dim:rgba(79,124,255,.12);--accent-glow:rgba(79,124,255,.25);--success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;--info:#3498db;--shadow:0 8px 32px rgba(0,0,0,.45);--radius:14px;--radius-sm:8px;--transition:.2s cubic-bezier(.4,0,.2,1);--font:'Segoe UI',system-ui,-apple-system,sans-serif;--glass-bg:rgba(30,33,40,.72);--glass-border:rgba(255,255,255,.06);--scrollbar-track:var(--bg-secondary);--scrollbar-thumb:#2e3340;--font-size-base:14px;--btn-size-scale:1}
        .light{--bg-primary:#f0f2f7;--bg-secondary:#e8eaf0;--bg-card:#ffffff;--bg-card-hover:#f5f7fc;--bg-input:#f0f2f7;--bg-sidebar:#e4e6ed;--text-primary:#1a1d27;--text-secondary:#4a5268;--text-muted:#8a94a8;--border-color:#d0d4e0;--shadow:0 8px 32px rgba(0,0,0,.10);--glass-bg:rgba(255,255,255,.72);--glass-border:rgba(0,0,0,.06);--scrollbar-track:#e8eaf0;--scrollbar-thumb:#c0c6d4}

        .btn-icon{width:calc(36px*var(--btn-size-scale));height:calc(36px*var(--btn-size-scale));padding:0;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border-color);background:var(--bg-input);color:var(--text-secondary);cursor:pointer;transition:all var(--transition);font-size:calc(var(--font-size-base)*1.05)}

        textarea{resize:vertical;min-height:60px;font-family:'Monaco','Menlo',monospace;font-size:calc(var(--font-size-base)*.85)}

        .badge-status.connecting{background:rgba(243,156,18,.15);color:var(--warning)}

        .empty-state h3{font-size:calc(var(--font-size-base)*1.15);color:var(--text-primary);margin-bottom:4px}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;animation:fadeIn .2s ease}
        .modal-overlay.open{display:flex}@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
        .modal{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border-color);max-width:960px;width:100%;max-height:95vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.5);animation:slideUp .25s ease}
        @keyframes slideUp{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}

        .modal-footer{padding:12px 20px;border-top:1px solid var(--border-color);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;flex-wrap:wrap}
        .toast-container{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;max-width:380px;width:100%;pointer-events:none}
        .toast{padding:12px 16px;border-radius:var(--radius-sm);background:var(--bg-card);border:1px solid var(--border-color);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;pointer-events:auto;animation:slideToast .3s ease;font-size:calc(var(--font-size-base)*.95)}

        .pill{padding:2px 10px;border-radius:20px;font-size:calc(var(--font-size-base)*.75);font-weight:600;background:var(--accent-dim);color:var(--accent)}
        .search-box{position:relative}.search-box input{padding-left:34px}.search-box .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted)}
        .flex{display:flex}.flex-center{align-items:center;justify-content:center}.flex-between{display:flex;align-items:center;justify-content:space-between}
        .gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
        .mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mb-2{margin-bottom:8px}
        .text-secondary{color:var(--text-secondary)}.text-muted{color:var(--text-muted)}.w-full{width:100%}

        .tab-bar .tab{padding:6px 16px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;cursor:pointer;font-size:calc(var(--font-size-base)*.95);font-weight:500;color:var(--text-secondary);border:none;background:transparent;transition:all var(--transition);font-family:inherit}

        .help-section{background:var(--bg-input);border-radius:var(--radius-sm);padding:14px 16px;border:1px solid var(--border-color);margin-bottom:10px}

        .back-btn:hover{background:rgba(231,76,60,.15);color:var(--danger)}
        .json-edit-btn{flex-shrink:0;padding:2px 6px;font-size:calc(var(--font-size-base)*.7);background:var(--accent-dim);color:var(--accent);border:none;border-radius:4px;cursor:pointer;transition:all var(--transition)}

        .settings-group{margin-bottom:16px}
        .settings-group .label{font-size:calc(var(--font-size-base)*.85);font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px;display:block}
